name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
          cache: 'pip'
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check rick_mcp.py rick_mcp/ tests/ smoke_test.py

      - name: Format check (ruff)
        run: ruff format --check rick_mcp.py rick_mcp/ tests/ smoke_test.py

      - name: File length (max 1500 lines)
        run: make file-length

      - name: Counts drift (README / SKILLS / badges in sync)
        if: matrix.python-version == '3.12'
        run: python scripts/refresh_counts.py --check

      - name: Type check (mypy)
        run: mypy rick_mcp/

      - name: Tests with coverage
        run: pytest tests/ -v --cov=rick_mcp --cov=scripts --cov-report=term-missing --cov-fail-under=90

      - name: Docker build verification
        if: matrix.python-version == '3.12'
        run: docker build -t rick_mcp:ci-test .

      - name: Generate coverage badge
        if: matrix.python-version == '3.12' && github.ref == 'refs/heads/main'
        run: |
          COVERAGE=$(coverage report 2>/dev/null | grep "^TOTAL" | awk '{print $NF}' | tr -d '%')
          echo "Coverage: ${COVERAGE}%"
          mkdir -p .badges
          echo "{\"schemaVersion\":1,\"label\":\"coverage\",\"message\":\"${COVERAGE}%\",\"color\":\"brightgreen\"}" > .badges/coverage.json

      - name: Upload coverage badge
        if: matrix.python-version == '3.12' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-badge
          path: .badges/coverage.json

  audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Audit runtime dependencies
        # Audits the shipped dependency surface (requirements.txt) + transitives against
        # the advisory DB. Fails the build on a known vuln. If a transitive vuln has no
        # fix available, add `--ignore-vuln <ID>` here with a comment until it does.
        run: pip-audit -r requirements.txt
