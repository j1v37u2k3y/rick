name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "mcp[cli]>=1.0.0" "pydantic>=2.0.0"
          pip install pytest pytest-asyncio pytest-cov ruff mypy

      - name: Lint (ruff)
        run: ruff check rick_mcp.py tests/

      - name: Format check (ruff)
        run: ruff format --check rick_mcp.py tests/

      - name: Type check (mypy)
        run: mypy rick_mcp.py --ignore-missing-imports --no-strict-optional

      - name: Tests with coverage
        run: pytest tests/ -v --cov=rick_mcp --cov-report=term-missing --cov-fail-under=80

      - name: Generate coverage badge
        if: matrix.python-version == '3.12' && github.ref == 'refs/heads/main'
        run: |
          COVERAGE=$(pytest tests/ --cov=rick_mcp --cov-report=term 2>/dev/null | grep "^TOTAL" | awk '{print $NF}' | tr -d '%')
          echo "Coverage: ${COVERAGE}%"
          mkdir -p .badges
          echo "{\"schemaVersion\":1,\"label\":\"coverage\",\"message\":\"${COVERAGE}%\",\"color\":\"brightgreen\"}" > .badges/coverage.json

      - name: Upload coverage badge
        if: matrix.python-version == '3.12' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-badge
          path: .badges/coverage.json
