[project]
name = "rick-mcp"
dynamic = ["version"]
description = "Rick MCP Server — A forkable security MCP platform. Load your identity, own your craft."
requires-python = ">=3.10"
license = "MIT"
# Runtime dependencies are declared once in requirements.txt — the file pip-audit scans and that
# requirements-dev.txt pulls in via `-r`. This project isn't packaged for `pip install` (flat-layout
# name collision between rick_mcp.py and rick_mcp/), so a `[project.dependencies]` table here would
# never be installed and would just drift from requirements.txt.
#
# Dev/test dependencies are declared once in requirements-dev.txt (the file `make setup` and
# CI install, and that Dependabot updates). This project isn't packaged for `pip install`, so
# no `[project.optional-dependencies]` table — it would duplicate that list and drift from it.

[tool.setuptools.dynamic]
version = {attr = "__version__.__version__"}

[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "S", "B"]
ignore = ["S101", "E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
# strict_optional stays ON (mypy default) — Optionals are narrowed at the call site.

[tool.coverage.run]
source = ["rick_mcp"]
omit = ["tests/*", "venv/*"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_empty = true
