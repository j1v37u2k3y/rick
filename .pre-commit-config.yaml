repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: detect-private-key
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.12
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: file-length-check
        name: file-length-check
        entry: "bash -c 'MAX=1500; FAIL=0; for f in \"$@\"; do LINES=$(wc -l < \"$f\"); if [ \"$LINES\" -gt \"$MAX\" ]; then echo \"ERROR: $f has $LINES lines (max $MAX)\"; FAIL=1; fi; done; exit $FAIL' --"
        language: system
        types: [python]

      - id: mypy
        name: mypy
        entry: bash -c 'source venv/bin/activate && python -m mypy rick_mcp.py --ignore-missing-imports --no-strict-optional'
        language: system
        types: [python]
        pass_filenames: false

      - id: pytest
        name: pytest
        entry: bash -c 'source venv/bin/activate && python -m pytest tests/ -x -q'
        language: system
        types: [python]
        pass_filenames: false
